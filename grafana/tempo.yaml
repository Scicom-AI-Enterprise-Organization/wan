# Tempo 2.7 single binary, local filesystem backend.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Kept only for the deprecated JAEGER_HOST/JAEGER_PORT path; prefer OTLP.
    jaeger:
      protocols:
        thrift_compact:
          endpoint: 0.0.0.0:6831
        thrift_http:
          endpoint: 0.0.0.0:14268

ingester:
  # Small blocks so traces reach the backend quickly in a demo. Recent traces are
  # already queryable straight from the ingester, so lookups do not wait for this.
  max_block_duration: 5m
  max_block_bytes: 1000000

compactor:
  compaction:
    block_retention: 24h

# Turns spans into RED metrics and a service graph, pushed into Prometheus. This is
# what makes Grafana's "Service Graph" tab and span-rate panels work.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      flush_to_storage: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      # local-blocks is what TraceQL metrics queries read from.
      processors: [service-graphs, span-metrics, local-blocks]
