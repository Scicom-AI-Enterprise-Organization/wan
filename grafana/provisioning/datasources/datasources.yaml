# NOTE: `$` is Grafana's provisioning variable marker, so every literal `$` used by
# a Grafana interpolation (`${__value.raw}` etc.) has to be written as `$$`.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000
      # This is the Loki -> Tempo half of the correlation. `trace_message` is in
      # every log line for exactly this reason.
      derivedFields:
        - name: TraceID
          matcherRegex: "traceID=(\\w+)"
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
          datasourceUid: tempo
        # Same link, driven by the structured metadata Alloy attaches, which keeps
        # working even if the line format changes.
        - name: TraceID (metadata)
          matcherType: label
          matcherRegex: traceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View trace"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # And the Tempo -> Loki half: jump from a span to the logs of that trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-10m"
        spanEndTimeShift: "10m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="fastapi"} |= "$${__span.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-10m"
        spanEndTimeShift: "10m"
        queries:
          - name: "Span request rate"
            query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[$$__rate_interval]))'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: "-10m"
        spanEndTimeShift: "10m"
      streamingEnabled:
        search: true
    # Trace id -> the Sentry issues carrying it. Select a span's traceID in Explore
    # and this runs a Sentry query beside the trace.
    #
    # `wan` tags every Sentry event with `traceID`, so `traceID:<id>` is an exact
    # search -- verified against the Sentry API, where the bare id and `trace:<id>`
    # both return nothing.
    #
    # Provisioning only supports query correlations: `type: external` panics Grafana
    # 11.6 on startup, and a non-default `config.type` is refused outright. An
    # external link to Sentry's own UI is a derived field on Loki instead, below.
    correlations:
      # The native datasource's lookup is built for this exact jump: trace id -> the
      # events carrying it, each with an "Open in bettersentryio" link. `kind` and
      # `trace` are the plugin's own query fields (src/types.ts).
      - targetUID: bsio-native
        label: bettersentryio events
        description: The exact events carrying this trace id
        config:
          type: query
          field: traceID
          target:
            kind: lookup
            trace: $${traceID}
      - targetUID: sentry
        label: Sentry issues
        description: Errors Sentry recorded for this trace
        config:
          # Must be spelled out: an absent config.type is the Go zero value, which
          # Grafana rejects as "non default value in config.type" and then refuses to
          # start. `query` is the only value provisioning accepts.
          type: query
          field: traceID
          target:
            queryType: issues
            issuesQuery: "traceID:$${traceID}"
            issuesSort: date
            issuesLimit: 25
            projectIds: []
            environments: []

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 10s
      # Click an exemplar on a latency graph and land on the trace behind it.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # Sentry, so an issue can be read next to the logs and traces of the same request.
  # Needs the `grafana-sentry-datasource` plugin, installed by GF_INSTALL_PLUGINS on
  # the grafana service. Unlike the rest of the stack this one is not self-contained:
  # it talks to a Sentry, so it stays inert until the three variables below are set in
  # grafana/.env. Grafana expands $VAR in provisioning files from its own environment.
  #
  # The token is NOT the DSN. A DSN's key only authorises *writing* events; reading
  # them back needs an auth token from Sentry (User settings -> Auth Tokens, or an
  # organisation token) with at least `project:read` and `event:read`.
  - name: Sentry
    type: grafana-sentry-datasource
    uid: sentry
    jsonData:
      # Self-hosted Sentry on the docker host is http://host.docker.internal:9090 --
      # `localhost` inside this container is Grafana itself.
      url: ${SENTRY_GRAFANA_URL}
      orgSlug: ${SENTRY_ORG_SLUG}
    secureJsonData:
      authToken: ${SENTRY_AUTH_TOKEN}

  # The native bettersentryio datasource: typed frames, monitors/incidents,
  # correlation-id lookup. Same engine and same token as the sentry-compat entry
  # above -- a new row rather than a rename, because the provisioner matches rows by
  # name and renaming a provisioned datasource in place is a crash-loop (measured in
  # the bettersentryio repo). Frontend-only: queries run in the browser and reach the
  # engine through the data proxy `engine` route, which attaches the token
  # server-side, so the browser never holds the credential.
  - name: bettersentryio-native
    type: scicom-bettersentryio-datasource
    uid: bsio-native
    access: proxy
    jsonData:
      url: ${SENTRY_GRAFANA_URL}
    secureJsonData:
      apiToken: ${SENTRY_AUTH_TOKEN}
