# Full local observability stack: the app, Tempo (traces), Loki (logs),
# Alloy (log shipping), Prometheus (metrics) and Grafana wired together.
#
# Host ports come from grafana/.env so this can coexist with another stack on the
# same machine. Defaults below are the canonical ones.
#
# Ports publish on ${BIND_HOST}, default 0.0.0.0 -- reachable from any machine that
# can route to this host. Grafana here runs with anonymous access enabled, so on an
# untrusted network set BIND_HOST=127.0.0.1 or turn anonymous auth off.
name: wan

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    labels:
      # Read by Alloy's docker discovery and turned into the Loki `job` label.
      logs.job: fastapi
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-wan}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEPLOYMENT_ENVIRONMENT: local
      # Defaults to the Tempo in this stack. Set OTLP_ENDPOINT in grafana/.env to a
      # remote collector's HTTP ingest instead -- an endpoint ending in /v1/traces
      # selects OTLP/HTTP on its own, so OTLP_PROTOCOL only needs setting to force it.
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://tempo:4317}
      OTLP_PROTOCOL: ${OTLP_PROTOCOL:-}
      # Basic auth for that remote collector; empty when pushing to the local Tempo.
      OTLP_USERNAME: ${OTLP_USERNAME:-}
      OTLP_PASSWORD: ${OTLP_PASSWORD:-}
      TRACING_SAMPLE: "1.0"
      LOGLEVEL: INFO
      ENABLE_HTTPX_INSTRUMENTATION: "true"
      # Off unless you put a DSN in grafana/.env. Sentry is a hosted service, so the
      # local stack cannot provide one; the test suite covers it with a mock ingest.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: local
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
      # sentry-sdk reads this natively; logs its transport requests and responses.
      SENTRY_DEBUG: ${SENTRY_DEBUG:-}
      # Puts clickable Loki/Tempo links on every Sentry event. This URL is only ever
      # rendered for a human, never fetched, so it must be the address *you* browse
      # Grafana on -- override with a LAN address to share the links.
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:${GRAFANA_PORT:-3000}}
      GRAFANA_DASHBOARD_UID: wan
      # /chain calls back through the compose network to show trace propagation.
      DOWNSTREAM_URL: http://app:8000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${APP_PORT:-7072}:8000"
    depends_on:
      - tempo
    restart: unless-stopped

  # Two genuinely separate services, so a single trace spans two service.name values
  # and the Tempo service graph gets a real service-a -> service-b edge.
  # Opt in:  docker compose -f grafana/docker-compose.yaml --profile two-services up -d
  service-a:
    profiles: ["two-services"]
    build:
      context: ..
      dockerfile: Dockerfile
    labels:
      logs.job: fastapi
    environment:
      SERVICE_NAME: service-a
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: local
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:${GRAFANA_PORT:-3000}}
      GRAFANA_DASHBOARD_UID: wan
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEPLOYMENT_ENVIRONMENT: local
      OTLP_ENDPOINT: http://tempo:4317
      LOGLEVEL: INFO
      ENABLE_HTTPX_INSTRUMENTATION: "true"
      DOWNSTREAM_URL: http://service-b:8000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVICE_A_PORT:-7080}:8000"
    depends_on:
      - tempo
    restart: unless-stopped

  service-b:
    profiles: ["two-services"]
    build:
      context: ..
      dockerfile: Dockerfile
    labels:
      logs.job: fastapi
    environment:
      SERVICE_NAME: service-b
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: local
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:${GRAFANA_PORT:-3000}}
      GRAFANA_DASHBOARD_UID: wan
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      DEPLOYMENT_ENVIRONMENT: local
      OTLP_ENDPOINT: http://tempo:4317
      LOGLEVEL: INFO
      ENABLE_HTTPX_INSTRUMENTATION: "true"
      # B is the leaf; call it with ?depth=0 so it does not hop further.
      DOWNSTREAM_URL: http://service-b:8000
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVICE_B_PORT:-7081}:8000"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      # Named volume, not a bind mount: the image ships /var/tempo owned by uid
      # 10001, and docker preserves that ownership only for named volumes.
      - tempo-data:/var/tempo
    ports:
      - "${BIND_HOST:-0.0.0.0}:${TEMPO_PORT:-3200}:3200"                       # HTTP API + TraceQL
      - "${BIND_HOST:-0.0.0.0}:${TEMPO_OTLP_GRPC_PORT:-4317}:4317"             # OTLP gRPC
      - "${BIND_HOST:-0.0.0.0}:${TEMPO_OTLP_HTTP_PORT:-4318}:4318"             # OTLP HTTP
      - "${BIND_HOST:-0.0.0.0}:${TEMPO_JAEGER_COMPACT_PORT:-6831}:6831/udp"    # legacy jaeger thrift
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "${BIND_HOST:-0.0.0.0}:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.4
    # Needs read access to the docker socket, which is root owned.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # Read by alloy.alloy; empty falls back to the local loki service.
      LOKI_URL: ${LOKI_URL:-}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For an app run on the host with LOG_FILE=grafana/logs/app.log.
      - ./logs:/host-logs
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ALLOY_PORT:-12345}:12345"
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      # Tempo's metrics generator pushes span metrics and service graphs here.
      - --web.enable-remote-write-receiver
      # Lets a Prometheus data point link straight to its trace in Tempo.
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Local demo stack: browse dashboards and Explore without logging in.
      # Grafana 11 only supports Viewer for anonymous, hence viewers_can_edit so
      # Explore still works. Log in as admin/admin for the full thing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Share links and alert notifications are built from this. Set
      # GRAFANA_ROOT_URL to the address other people actually reach it on.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:${GRAFANA_PORT:-3000}/}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor traceQLStreaming metricsSummary
      GF_USERS_DEFAULT_THEME: dark
      GF_LOG_LEVEL: warn
      # Downloaded on first start, so this one service needs outbound internet.
      GF_INSTALL_PLUGINS: grafana-sentry-datasource
      # Read by provisioning/datasources/datasources.yaml. Empty leaves the Sentry
      # datasource provisioned but unauthenticated, which is the local-stack default:
      # Sentry is hosted elsewhere, so it cannot be part of a self-contained stack.
      SENTRY_GRAFANA_URL: ${SENTRY_GRAFANA_URL:-https://sentry.io}
      SENTRY_ORG_SLUG: ${SENTRY_ORG_SLUG:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    extra_hosts:
      # So SENTRY_GRAFANA_URL can be host.docker.internal to reach a Sentry running
      # on this machine. Docker Desktop resolves it already; Linux needs this line.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_HOST:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - loki
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
