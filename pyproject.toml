[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wan"
description = "FastAPI boilerplate for Loki and Tempo."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Husein Zolkepli", email = "husein.zolkepli@scicom.com.my" }]
keywords = ["fastapi", "tempo", "loki", "grafana", "opentelemetry", "observability", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/Scicom-AI-Enterprise-Organization/wan"
Source = "https://github.com/Scicom-AI-Enterprise-Organization/wan"

[project.optional-dependencies]
# Deprecated upstream since OpenTelemetry 1.16; only for legacy Jaeger agents.
jaeger = ["opentelemetry-exporter-jaeger-thrift"]
httpx = ["opentelemetry-instrumentation-httpx"]
requests = ["opentelemetry-instrumentation-requests"]
sentry = ["sentry-sdk>=2.0"]
example = ["uvicorn[standard]>=0.23", "httpx>=0.24", "opentelemetry-instrumentation-httpx"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.24",
    "uvicorn[standard]>=0.23",
    "opentelemetry-instrumentation-httpx",
    "sentry-sdk>=2.0",
]

[tool.setuptools.dynamic]
version = { attr = "wan.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["wan*"]

[tool.setuptools.package-data]
# Ships the inline type hints to downstream type checkers (PEP 561).
wan = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
